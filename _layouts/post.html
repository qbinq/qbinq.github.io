<!DOCTYPE html>
<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/post.css">
        <meta name = "viewport" content = "width = device-width, initial-scale = 1.0">
        <!-- <script type="text/javascript" src="http://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script> -->
        <!-- <script type="text/javascript" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
        </script> -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.css">
        <!-- <script defer src="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/katex.min.js"></script> -->
        <!-- <script defer src="https://cdn.jsdelivr.net/npm/katex@0.13.18/dist/contrib/auto-render.min.js"></script> -->
        <!-- <script>
            document.addEventListener("DOMContentLoaded", function() {
                renderMathInElement(document.body);
            });
        </script> -->
    </head>
<body>

    <div class = "page">
        <aside class = "sidebar" id = "table-of-contents">
            {% toc %}
        </aside>

        <main class="content">

            <div style="display: flex; align-items: center;justify-content: space-between;">
                <a href="/">
                <img src = "/assets/hover.svg" alt="go-back" class="back-icon">
                </a>
                <h2 class="post-title">{{page.title}} </h2>

                <img src = "/assets/hover.svg" id = "ghost" class = "back-icon">
            </div>

            <center>
            <h6 class="post-meta">
                {{page.date | date: "%d %b, %Y" }} - {{page.categories}}
            </h6>
            </center>
            <div class = "post-content">
                {{content}}
            </div>
        </main>
        <div class ="sidebar" id = "ghost"></div>
    </div>

    <footer class = "footer">© Todos los derechos reservados</footer>
</body>
</html>
