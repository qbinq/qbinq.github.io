---
layout: default
title: Artículos
permalink: /articulo/
---
{% for post in site.categories.Articulo %}
<article class="post">
    <a href="{{post.url}}">
    <h2 class="post-title">{{post.title}} </h2>

    <h6 class="post-meta">
        {{post.date | date: "%d %b, %Y"}} - {{post.categories}}
    </h6>
    <hr class = "post-divider">
    <div class = "post-description">
        {{post.excerpt}}
    </div>
</a>
</article>
{% endfor %}
